name: Laravel CI/CD Automated Testing Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    env:
      APP_ENV: testing
      APP_KEY: base64:wl0AaiV98ca0ClO6qxviNrt+DEEZ65lghMG1AJXaMR8=
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      SESSION_DRIVER: array
      CACHE_STORE: array

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Setup PHP 8.4
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: mbstring, pdo, pdo_sqlite, sqlite3, dom, curl, libxml, filter, json, iconv
        coverage: none

    - name: Copy .env file
      run: cp .env.example .env

    - name: Install Composer Dependencies
      run: composer install --no-interaction --prefer-dist --optimize-autoloader

    - name: Generate Application Key
      run: php artisan key:generate

    - name: Setup Node.js & Build Frontend Assets
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install NPM Dependencies & Build Assets
      run: |
        npm install
        npm run build

    - name: Run PHPUnit Automated Tests
      run: php artisan test
